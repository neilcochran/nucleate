name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint:check

      - run: npm run format:check

      - run: npm run knip

      - run: npm run build

      # publint and attw inspect the publishable package, so they run after the build.
      - run: npm run lint:pack

      - run: npm run attw

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm test

  # Single required status check: passes only if every CI job above succeeds.
  # Lets branch protection require one context ("CI") instead of each job and
  # matrix leg, so changing the Node matrix never breaks the required checks.
  ci:
    name: CI
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
